name: Skill Release

# Only triggers on changes under skills/**. The release job below only ever
# writes to plugins/** and .claude-plugin/** (never skills/**), so its own
# commits never re-trigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Package and release any unreleased skill versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 tooling/package_skill.py release