name: Skill PR Check

# Deliberately NOT path-filtered. This check is a required status check on
# main, so it has to report on every PR -- including ones that touch nothing
# under skills/ (e.g. the generated marketplace-sync PR). A path filter would
# leave those PRs "Expected -- waiting for status" forever. package_skill.py
# check already no-ops ("No skill files changed") when no skill changed.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Check version bump and run contract tests
        run: python3 tooling/package_skill.py check --base ${{ github.base_ref }}