name: Skill PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check version bump and run contract tests
        run: python3 tooling/package_skill.py check --base ${{ github.base_ref }}